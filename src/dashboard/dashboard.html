          var lastSync = conn.lastSyncAt ? new Date(conn.lastSyncAt).toLocaleString() : 'Never';
          if (conn.minutesSinceSync !== null) {
            var hrs = Math.floor(conn.minutesSinceSync / 60);
            var mins = conn.minutesSinceSync % 60;
            lastSync += ' (' + (hrs > 0 ? hrs + 'h ' : '') + mins + 'm ago)';
          }
          cards += '<tr><td>' + conn.connectorId + '</td><td>' + lastSync + '</td><td>' +
            conn.lastRunCount + '</td><td>' + status + '</td><td>' +
            (conn.lastError ? '<span style="color:var(--accent-red)">' + conn.lastError + '</span>' : '&mdash;') +
            '</td></tr>';
        }
        cards += '</tbody></table></div>';
        c.innerHTML = cards;
      })
      .catch(function(e) {
        document.getElementById('sync-health-content').innerHTML =
          '<div class="setting-card"><h3>Unable to load sync health</h3><p>' + e.message + '</p></div>';
      });
  }

  function kpiCard(label, value, color) {
    return '<div class="mini-stat" style="border-left:3px solid ' + color + '">' +
      '<div class="mini-stat-value">' + value + '</div>' +
      '<div class="mini-stat-label">' + label + '</div></div>';
  }

  function loadAlerts() {
    try {
      var saved = localStorage.getItem('tip-alerts');
      if (saved) {
        var alerts = JSON.parse(saved);
        if (alerts.passRate) document.getElementById('alert-pass-rate').value = alerts.passRate;
        if (alerts.flakyRate) document.getElementById('alert-flaky-rate').value = alerts.flakyRate;
        if (alerts.webhook) document.getElementById('alert-webhook').value = alerts.webhook;
      }
    } catch (e) { /* ignore */ }
  }

  function saveAlerts() {
    var alerts = {
      passRate: document.getElementById('alert-pass-rate').value,
      flakyRate: document.getElementById('alert-flaky-rate').value,
      webhook: document.getElementById('alert-webhook').value,
    };
    localStorage.setItem('tip-alerts', JSON.stringify(alerts));
    var status = document.getElementById('alert-status');
    status.innerHTML = '<span class="badge green">Saved</span> Alerts will trigger when pass rate drops below ' + alerts.passRate + '% or flaky rate exceeds ' + alerts.flakyRate + '%.';
    checkAlerts(alerts);
  }

  function checkAlerts(alerts) {
    var r = state.rollup;
    if (!r) return;
    var passThreshold = parseFloat(alerts.passRate) || 0;
    var flakyThreshold = parseFloat(alerts.flakyRate) || 100;
    var violations = [];
    if (r.passRate < passThreshold) violations.push('Pass rate ' + r.passRate + '% is below threshold ' + passThreshold + '%');
    if (r.flakyRate > flakyThreshold) violations.push('Flaky rate ' + r.flakyRate + '% exceeds threshold ' + flakyThreshold + '%');
    if (violations.length > 0) {
      var status = document.getElementById('alert-status');
      if (status) {
        status.innerHTML += '<div style="margin-top:0.5rem;padding:0.5rem 0.75rem;background:rgba(255,68,102,0.1);border:1px solid var(--accent-red);border-radius:8px;color:var(--accent-red);font-size:0.8rem">' +
          '<strong>&#9888; Active Alerts:</strong><br>' + violations.join('<br>') + '</div>';
      }
    }
  }

  function loadStorageStatus() {
    api('/storage/config').then(function(cfg) {
      var el = document.getElementById('storage-status-card');
      if (!cfg.configured) {
        el.innerHTML = '<h3>Cloud Storage</h3><p>No cloud storage connected. Using local file storage. ' +
          'Connect below to use OneDrive or Google Drive as shared storage.</p>';
        document.getElementById('connect-form').style.display = 'block';
      } else {
        el.innerHTML = '<h3>Cloud Storage</h3><p><span class="badge green">Connected</span> ' + cfg.provider + ' &mdash; ' + esc(cfg.folderPath) + '</p>' +
          '<button class="btn btn-danger" id="disconnect-btn" style="margin-top:0.75rem">Disconnect</button>';
        document.getElementById('disconnect-btn').onclick = disconnectStorage;
      }
      loadTeamConfigs();
    }).catch(function() { document.getElementById('storage-status-card').innerHTML = '<h3>Cloud Storage</h3><p style="color:var(--accent-red)">Failed to load storage status</p>'; });
  }

  function loadTeamConfigs() {
    api('/storage/team-configs').then(function(data) {
      var configs = data.configs || [];
      if (configs.length === 0) return;
      var el = document.getElementById('team-configs');
      el.style.display = 'block';
      var html = '<h3>Team Configurations</h3><p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.5rem">Other users in this deployment have configured:</p><table>' +
        '<tr><th>User</th><th>Provider</th><th>Folder</th></tr>';
      for (var i = 0; i < configs.length; i++) {
        html += '<tr><td>' + esc(configs[i].userId) + '</td><td>' + esc(configs[i].provider) + '</td><td>' + esc(configs[i].folderPath) + '</td></tr>';
      }
      html += '</table><p style="font-size:0.75rem;color:var(--text-muted);margin-top:0.5rem">Use the same provider and folder path to see shared data.</p>';
      el.innerHTML = html;
    }).catch(function() {});
  }

  function connectStorage() {
    var body = { provider: document.getElementById('provider').value, clientId: document.getElementById('client-id').value, clientSecret: document.getElementById('client-secret').value, redirectUri: document.getElementById('redirect-uri').value, folderPath: document.getElementById('folder-path').value };
    fetch('/api/storage/connect', { method: 'POST', headers: Object.assign({}, getAuthHeaders(), { 'Content-Type': 'application/json' }), body: JSON.stringify(body) })
      .then(function(r) { return r.json(); }).then(function(data) {
        if (data.warning) alert(data.warning);
        if (data.authorizeUrl) window.location.href = data.authorizeUrl;
        else alert('Error: ' + (data.error || 'unknown'));
      }).catch(function(e) { alert('Error: ' + e.message); });
  }

  function disconnectStorage() {
    if (!confirm('Disconnect cloud storage? Data will remain in your cloud drive.')) return;
    fetch('/api/storage/disconnect', { method: 'POST', headers: getAuthHeaders() }).then(function() { loadStorageStatus(); });
  }

  // -- Helpers ---------------------------------------------------------
  function emptyState(msg) {
    return '<div class="empty-state"><div class="empty-state-icon">&#9776;</div><div class="empty-state-text">' + msg + '</div></div>';
  }

  // -- Data loading ----------------------------------------------------
  function loadEstate() {
    render();
    api('/estate?period=' + state.period).then(function(rollup) {
      state.rollup = rollup;
      api('/runs?limit=100').then(function(runs) {
        state.runs = runs;
        render();
      }).catch(function() { render(); });
    }).catch(function(e) { document.getElementById('main').innerHTML = emptyState('Failed to load: ' + e.message); });
  }

  function render() {
    if (!state.session) { renderLogin(); return; }
    renderDashboard();
  }

  // -- Init ------------------------------------------------------------
  // Global keyboard shortcuts: ⌘K / Ctrl+K = search, Escape = close search, ⌘B / Ctrl+B = toggle sidebar
  document.addEventListener('keydown', function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      if (document.getElementById('search-overlay')) { closeSearch(); } else if (state.session) { openSearch(); }
    }
    if (e.key === 'Escape') {
      if (document.getElementById('search-overlay')) { closeSearch(); }
    }
    if ((e.metaKey || e.ctrlKey) && e.key === 'b') {
      e.preventDefault();
      var shell = document.getElementById('app-shell');
      if (shell) shell.classList.toggle('sidebar-collapsed');
    }
  });
  render();
})();
</script>
